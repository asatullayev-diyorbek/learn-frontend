<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kirish — Learn</title>
    <meta
      name="description"
      content="Learn platformasiga Telegram orqali kirish."
    />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/pages/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-shell">
        <div class="auth-logo" aria-hidden="true">
          <svg viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Learn">
            <circle cx="20" cy="20" r="18" fill="var(--color-brand)" />
            <path
              d="M12 21.5L18 27L29 14"
              stroke="var(--color-brand-contrast)"
              stroke-width="3.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              fill="none"
            />
            <text
              x="46"
              y="27"
              font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif"
              font-size="22"
              font-weight="700"
              fill="var(--color-text)"
            >Learn</text>
          </svg>
        </div>

        <section class="card auth-card">
          <div class="auth-heading">
            <h1>Telegram orqali kirish</h1>
            <p>Learn'ga kirish uchun Telegram'dan foydalaning</p>
          </div>

          <div class="tab-toggle" role="tablist" aria-label="Kirish usuli">
            <button type="button" id="tab-token" role="tab" aria-selected="true">
              Token orqali
            </button>
            <button type="button" id="tab-code" role="tab" aria-selected="false">
              Kod orqali
            </button>
          </div>

          <!-- Method 1: deep link / one-time token -->
          <div class="auth-method" id="method-token">
            <div id="token-status">
              <div id="token-loading" class="alert alert-info">
                <span class="spinner" aria-hidden="true"></span>
                <span>Token so'ralmoqda...</span>
              </div>

              <div id="token-error" class="alert alert-danger" hidden>
                <span id="token-error-text">Xatolik yuz berdi.</span>
              </div>
              <button
                type="button"
                id="token-retry-btn"
                class="btn btn-secondary"
                hidden
              >
                Qayta urinish
              </button>

              <div id="token-ready" hidden>
                <a
                  id="deep-link-btn"
                  class="btn btn-primary"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                >
                  Telegram botga o'tish
                </a>

                <div class="token-row" style="margin-top: var(--space-4)">
                  <code id="token-value"></code>
                  <button
                    type="button"
                    id="copy-token-btn"
                    class="btn btn-icon"
                    aria-label="Tokenni nusxalash"
                    title="Nusxalash"
                  >
                    &#10063;
                  </button>
                </div>
                <div class="token-meta">
                  <span class="hint" id="token-expiry-note">
                    Amal qilish muddati: 10 daqiqa
                  </span>
                  <span
                    id="copy-feedback"
                    class="hint"
                    style="color: var(--color-success)"
                    hidden
                    >Nusxalandi!</span
                  >
                </div>
              </div>
            </div>

            <div class="auth-divider">yoki</div>

            <div class="auth-switch">
              <button type="button" id="switch-to-code-btn" class="btn-link">
                Kodni Telegram orqali olish
              </button>
            </div>
          </div>

          <!-- Method 2: 5-digit code via bot /login -->
          <div class="auth-method" id="method-code" hidden>
            <p>Telegram'da <strong>/login</strong> yuboring</p>

            <a
              id="bot-open-btn"
              class="btn btn-secondary"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
            >
              Telegram botni ochish
            </a>

            <form id="code-form" class="code-form" novalidate>
              <div class="field">
                <label class="field-label" for="code-input">5 xonali kod</label>
                <input
                  type="text"
                  id="code-input"
                  class="input input-code"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  maxlength="5"
                  autocomplete="one-time-code"
                  placeholder="00000"
                  aria-label="5 xonali kod"
                />
              </div>

              <div id="code-error" class="alert alert-danger" hidden></div>

              <button type="submit" id="code-submit-btn" class="btn btn-primary">
                Tasdiqlash va kirish
              </button>

              <p class="auth-footnote">Kod 5 daqiqa amal qiladi</p>
            </form>

            <div class="auth-switch">
              <button type="button" id="switch-to-token-btn" class="btn-link">
                Token orqali kirish
              </button>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script type="module" src="js/pages/login.js"></script>
  </body>
</html>
